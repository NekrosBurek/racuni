plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'rs.racuni'
version = '1.0.0'

android {
  namespace "rs.racuni.textscanner"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Latin model bundled in the APK, so it works offline from the first launch.
  implementation "com.google.mlkit:text-recognition:16.0.1"
  // Same CameraX version as expo-camera, so both cameras share one copy of the library.
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.appcompat:appcompat:1.7.1"
}
