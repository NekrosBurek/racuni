name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  # Pull requests only build (no signing, no release), so native changes are compiled before merging.
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

# A newer push makes the running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle downloads and build outputs between runs.
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Native code only changes with dependencies, config, assets or modules/; reuse its build outputs otherwise.
      # Restored after npm ci, which would delete the node_modules parts.
      - uses: actions/cache@v4
        with:
          key: native-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.config.js', 'assets/**', 'modules/**') }}
          path: |
            android
            node_modules/**/android/build
            node_modules/**/android/.cxx

      - run: node receipt.test.mjs

      # The app's updater compares this version with the latest release tag.
      - name: Set version 1.0.${{ github.run_number }}
        run: sed -i "s/^export const VERSION = .*/export const VERSION = '1.0.${{ github.run_number }}';/" version.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # Phones only need the two ARM builds; x86/x86_64 run only on emulators, and each extra ABI recompiles all native code.
      - name: Build APK
        # R8 shrinking took ~2.5 min per build; a sideloaded APK doesn't need it.
        run: >-
          ./gradlew assembleRelease --build-cache
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pandroid.enableMinifyInReleaseBuilds=false
          -Pandroid.enableShrinkResourcesInReleaseBuilds=false
        working-directory: android

      # Re-sign with our own key so every release installs over the previous one.
      - name: Sign APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -di > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
            --out racuni.apk android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify racuni.apk
          rm release.keystore

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" racuni.apk \
            --title "Računi 1.0.${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message || 'Ručni build' }}"
