name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  # Pull requests build an x86_64 APK for the Android emulator (no release), so changes can be tried before merging.
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

# A newer push makes the running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Phones only need the two ARM builds; the emulator on the PC is x86_64. Each extra ABI recompiles all native code.
      # (Cache keys can't contain commas, so the native cache below names the build kind instead of this list.)
      ABIS: ${{ github.event_name == 'pull_request' && 'x86_64' || 'arm64-v8a,armeabi-v7a' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle downloads and build outputs between runs.
      - uses: gradle/actions/setup-gradle@v4
      # Compiled C++ cached by file content: CMake decides by timestamps, so every fresh checkout recompiled
      # all of it (~1.5 min). The cache only skips identical compiler runs; the APK is the same.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}
          max-size: 1G

      - run: npm ci

      # Native code only changes with dependencies, config, assets or modules/; reuse its build outputs otherwise.
      # Restored after npm ci, which would delete the node_modules parts.
      - uses: actions/cache@v4
        with:
          key: native-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'x86_64' || 'arm' }}-${{ hashFiles('package-lock.json', 'app.config.js', 'assets/**', 'modules/**') }}
          path: |
            android
            node_modules/**/android/build
            node_modules/**/android/.cxx

      - run: node receipt.test.mjs

      # The app's updater compares this version with the latest release tag.
      - name: Set version 1.0.${{ github.run_number }}
        run: sed -i "s/^export const VERSION = .*/export const VERSION = '1.0.${{ github.run_number }}';/" version.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Build APK
        # R8 shrinking took ~2.5 min per build; a sideloaded APK doesn't need it.
        run: >-
          ./gradlew assembleRelease --build-cache
          -PreactNativeArchitectures=${{ env.ABIS }}
          -Pandroid.enableMinifyInReleaseBuilds=false
          -Pandroid.enableShrinkResourcesInReleaseBuilds=false
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines

      # Re-sign with our own key so every release installs over the previous one (and Google sign-in, which checks
      # the key, also works in the emulator build).
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -di > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
            --out racuni.apk android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify racuni.apk
          rm release.keystore

      - name: Emulator APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: racuni-emulator
          path: racuni.apk
          retention-days: 14

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" racuni.apk \
            --title "Računi 1.0.${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message || 'Ručni build' }}"
